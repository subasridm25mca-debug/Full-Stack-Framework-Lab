<!DOCTYPE html>
<html lang="en" ng-app="calculatorApp">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AngularJS Calculator</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="app.js"></script>
</head>

<body ng-controller="CalculatorController">

    <div class="calculator">

        <input type="text" class="display" ng-model="display" readonly>

        <div class="buttons">

            <button ng-click="clear()">C</button>
            <button ng-click="operation('/')">/</button>
            <button ng-click="operation('*')">*</button>
            <button ng-click="backspace()">⌫</button>

            <button ng-click="number(7)">7</button>
            <button ng-click="number(8)">8</button>
            <button ng-click="number(9)">9</button>
            <button ng-click="operation('-')">−</button>

            <button ng-click="number(4)">4</button>
            <button ng-click="number(5)">5</button>
            <button ng-click="number(6)">6</button>
            <button ng-click="operation('+')">+</button>

            <button ng-click="number(1)">1</button>
            <button ng-click="number(2)">2</button>
            <button ng-click="number(3)">3</button>
            <button class="equal" ng-click="calculate()">=</button>

            <button class="zero" ng-click="number(0)">0</button>
            <button ng-click="decimal()">.</button>

        </div>

    </div>

</body>
</html>
