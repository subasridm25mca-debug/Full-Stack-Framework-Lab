<section class="booking-page">

  <div class="page-header">
    <h2>Complete Your Booking</h2>
    <p>Enter your travel details to confirm your trip</p>
  </div>

  <div class="booking-container">

    <form (ngSubmit)="confirmBooking()">

      <div class="form-grid">

        <!-- Full Name -->
        <div class="form-group">
          <label>Full Name</label>
          <input
            type="text"
            name="fullName"
            [(ngModel)]="booking.fullName"
            placeholder="Enter your full name"
            required>
        </div>


        <!-- Email -->
        <div class="form-group">
          <label>Email Address</label>
          <input
            type="email"
            name="email"
            [(ngModel)]="booking.email"
            placeholder="Enter your email"
            required>
        </div>


        <!-- Phone -->
        <div class="form-group">
          <label>Phone Number</label>
          <input
            type="tel"
            name="phone"
            [(ngModel)]="booking.phone"
            placeholder="Enter your phone number"
            required>
        </div>


        <!-- Destination -->
        <div class="form-group">
          <label>Destination</label>

          <select
            name="destination"
            [(ngModel)]="booking.destination">

            <option value="Goa">Goa</option>
            <option value="Manali">Manali</option>
            <option value="Dubai">Dubai</option>
            <option value="Maldives">Maldives</option>
            <option value="Paris">Paris</option>
            <option value="Singapore">Singapore</option>

          </select>
        </div>


        <!-- Travel Date -->
        <div class="form-group">
          <label>Travel Date</label>

          <input
            type="date"
            name="travelDate"
            [(ngModel)]="booking.travelDate"
            required>
        </div>


        <!-- Travellers -->
        <div class="form-group">
          <label>Number of Travellers</label>

          <select
            name="travellers"
            [(ngModel)]="booking.travellers">

            <option>1 Traveller</option>
            <option>2 Travellers</option>
            <option>3 Travellers</option>
            <option>4 Travellers</option>
            <option>5+ Travellers</option>

          </select>
        </div>

      </div>


      <!-- Travel Package -->
      <div class="form-group full-width">
        <label>Travel Package</label>

        <select
          name="package"
          [(ngModel)]="booking.package">

          <option>Family Package</option>
          <option>Couple Package</option>
          <option>Adventure Package</option>
          <option>Luxury Package</option>
          <option>Budget Package</option>

        </select>
      </div>


      <!-- Special Requests -->
      <div class="form-group full-width">
        <label>Special Requests</label>

        <textarea
          name="requests"
          [(ngModel)]="booking.requests"
          placeholder="Any special requirements or requests?">
        </textarea>
      </div>


      <!-- Confirm Button -->
      <div class="button-container">
        <button type="submit" class="confirm-btn">
          CONFIRM BOOKING
        </button>
      </div>

    </form>


    <!-- Success Message -->
    @if (bookingConfirmed) {

      <div class="success-message">

        <h3>🎉 Booking Confirmed Successfully!</h3>

        <p>
          Thank you, {{ booking.fullName || 'Sri' }}!
        </p>

        <p>
          Your trip to <strong>{{ booking.destination }}</strong>
          has been booked successfully.
        </p>

      </div>

    }

  </div>

</section>
